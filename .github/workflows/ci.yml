name: CI 校验

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: npm run check

      - name: 代码格式检查
        run: npm run format:check

      - name: 纯函数单元测试
        run: npm run test:unit

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI 冒烟（桌面 / 移动 / 360px 视口）
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 1
          ONEKNIFE_CHANNEL=chromium npm run test:ui

      - name: 界面渲染与输入回归
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 1
          ONEKNIFE_CHANNEL=chromium npm run test:ui:regression

      - name: 铭牌可读性回归（飘字/特效环/铭牌互不遮挡）
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 1
          ONEKNIFE_CHANNEL=chromium npm run test:ui:nameplate

      # 0.6.7：共享 runner 是软件渲染（无 GPU），拿不到真机的 p99 ≤ 4ms / 零长帧。
      # 这里改用容器基线阈值并 continue-on-error：日志仍打印 PERF PROBE 供看趋势，
      # 但不让「跑分环境」把功能回归的 CI 长期拖红。真机/本机仍按 perf-probe 默认 4ms 门禁。
      - name: 帧率探针（容器基线：p99 ≤ 20ms、20ms+ 长帧 ≤ 10）
        continue-on-error: true
        env:
          ONEKNIFE_PERF_P99_MAX: "20"
          ONEKNIFE_PERF_OVER20_MAX: "10"
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 1
          ONEKNIFE_CHANNEL=chromium npm run perf