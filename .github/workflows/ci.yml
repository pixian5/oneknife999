# 《一刀999》CI：push / PR 自动回归。
# 两段式——verify（语法 + 版本/素材门禁 + prettier + 单测，无浏览器）与 ui（关键浏览器回归矩阵）。
# 浏览器统一用 playwright 自带 chromium（ONEKNIFE_CHANNEL=chromium），
# 避免宿主 Chrome 版本漂移；静态服务按 tests/ 默认约定起在 4174 端口。
name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:

jobs:
  verify:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 语法 / 版本 / 素材 / 格式 / 单测
        run: npm run verify

  ui:
    name: 浏览器回归 ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # 0.8.78：把状态条、真实状态、移动端点击、HUD 血量、死亡存档纳入每次 push；
        # 0.8.81：新增 F90 回响 B / 入口补给（ui:echo）与死亡保留 A/B（ui:preserve）。
        # 全量 UI 仍由本地/夜间任务跑，当前矩阵 22 项，避免每次矩阵过宽。
        test:
          [
            ui,
            ui:layout,
            ui:levelup,
            ui:regression,
            ui:nameplate,
            ui:abilities,
            ui:elite,
            ui:threats,
            ui:blind,
            ui:timeline,
            ui:summon,
            ui:fixes0831,
            ui:abyss,
            ui:abyss-terrain,
            ui:cast,
            ui:status,
            ui:status-real,
            ui:touch,
            ui:hud-health,
            ui:death-save,
            ui:echo,
            ui:preserve
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖与浏览器
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: 启动静态服务（4174）
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 2
          curl -sf http://127.0.0.1:4174/ -o /dev/null
      - name: 运行 test:${{ matrix.test }}
        env:
          ONEKNIFE_CHANNEL: chromium
        run: npm run test:${{ matrix.test }}

  perf:
    name: 性能门禁（软件渲染基线）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖与浏览器
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: 启动静态服务（4174）
        run: |
          python3 -m http.server 4174 --directory game &
          sleep 2
      # 0.8.36：perf 进 CI。Ubuntu 软件渲染 p99 与 macOS 本机（1-2ms）不可比（约 10ms），
      # 用 ONEKNIFE_PERF_P99_MAX=12 放宽；零 20ms+ 长帧仍是硬指标（渲染方式无关）。
      - name: 帧率探测与门禁
        run: ONEKNIFE_CHANNEL=chromium ONEKNIFE_PERF_P99_MAX=12 npm run perf
